<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of toastService.toasts(); track toast.id) {
    <article class="toast" [class.success]="toast.type === 'success'" [class.error]="toast.type === 'error'">
      <p>{{ toast.message }}</p>
      <button type="button" (click)="toastService.remove(toast.id)" [attr.aria-label]="'COMMON.CLOSE_NOTIFICATION' | translate">x</button>
    </article>
  }
</div>
